<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>DeepSeek Harness</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0b1220; color: #e2e8f0; }
  /* 启动遮罩：服务就绪后整窗导航到 DSH（顶层页，localStorage 可持久化 → 恢复上次会话） */
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0b1220; }
  .spinner { width: 26px; height: 26px; border: 3px solid #1e293b; border-top-color: #3b82f6; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #boot-text { font-size: 13px; color: #94a3b8; }
  #boot-restart { display: none; padding: 6px 16px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; cursor: pointer; font-size: 13px; }
  #boot-restart:hover { background: #334155; }
</style>
</head>
<body>
  <div id="boot">
    <div class="spinner"></div>
    <div id="boot-text">正在启动 DSH…</div>
    <button id="boot-restart">重启服务</button>
  </div>
  <script>
    const tauri = window.__TAURI__;
    const $ = (id) => document.getElementById(id);
    const boot = $('boot');
    let fast = true; // 就绪前快速轮询（250ms）

    function render(snapshot) {
      const st = snapshot.state;
      if (st === 'ready' || st === 'reused') {
        // 整窗导航到 DSH：顶层页面 → localStorage 持久化 → 恢复上次会话
        window.location.replace('http://127.0.0.1:' + snapshot.port + '/?dsh=desktop');
      } else if (st === 'error') {
        fast = true;
        $('boot-text').textContent = '服务异常：' + (snapshot.error || '未知错误');
        $('boot-restart').style.display = 'inline-block';
      } else {
        fast = true;
        $('boot-text').textContent = '正在启动 DSH…';
        $('boot-restart').style.display = 'none';
      }
    }

    async function poll() {
      try {
        render(await tauri.core.invoke('server_status'));
      } catch (e) {
        // 查询失败保持当前遮罩
      }
      setTimeout(poll, fast ? 250 : 2000);
    }

    $('boot-restart').addEventListener('click', async () => {
      $('boot-restart').style.display = 'none';
      $('boot-text').textContent = '正在启动 DSH…';
      try { await tauri.core.invoke('restart_server'); } catch (e) { console.error(e); }
    });

    if (!tauri) {
      // 浏览器预览模式：直接打开
      window.location.replace('http://127.0.0.1:3080/?dsh=desktop');
    } else {
      poll();
    }
  </script>
</body>
</html>
