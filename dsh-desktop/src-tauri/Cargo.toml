[package]
name = "dsh-desktop"
version = "0.1.0"
description = "DeepSeek Harness 桌面应用（Tauri v2）"
edition = "2021"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
libc = "0.2"

[profile.release]
strip = true
